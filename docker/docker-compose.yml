version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: collabsphere-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo_data:/data/db
    networks:
      - collabsphere-network

  # Backend Service
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: collabsphere-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://admin:admin123@mongo:27017/collabsphere?authSource=admin
      JWT_SECRET: your_jwt_secret_key_change_this
      CLIENT_URL: http://localhost:3000
    depends_on:
      - mongo
    networks:
      - collabsphere-network

  # Frontend Service
  frontend:
    build:
      context: ../client
      dockerfile: ../docker/frontend.Dockerfile
    container_name: collabsphere-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - collabsphere-network

networks:
  collabsphere-network:
    driver: bridge

volumes:
  mongo_data:
