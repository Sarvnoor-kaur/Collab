apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: collabsphere
spec:
  selector:
    app: mongo
  ports:
  - port: 27017
    targetPort: 27017
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: collabsphere
spec:
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: collabsphere
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30300
  type: NodePort
